<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>INIADの紹介</title>
    <style>
      :root {
        --bg: #eef5f8;
        --panel: #ffffff;
        --text: #1f2d3d;
        --muted: #4c5d70;
        --primary: #0d7e8c;
        --primary-dark: #0a5d6d;
        --line: #dfeaf0;
        --shadow: rgba(15, 42, 58, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 40px 20px;
        background: linear-gradient(180deg, #f4f9fb 0%, #edf3f7 100%);
        font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
        color: var(--text);
        line-height: 1.8;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: 0 18px 40px var(--shadow);
        padding: 40px 48px;
      }

      h1 {
        margin: 0 0 28px;
        padding-bottom: 18px;
        border-bottom: 3px solid var(--primary);
        color: var(--primary-dark);
        font-size: clamp(2rem, 4vw, 3rem);
        letter-spacing: 0.08em;
        line-height: 1.3;
      }

      h2 {
        position: relative;
        margin: 36px 0 12px;
        padding-left: 16px;
        font-size: 1.5rem;
        color: var(--text);
      }

      h2::before {
        content: "";
        position: absolute;
        left: 0;
        top: 50%;
        width: 6px;
        height: 1.4em;
        transform: translateY(-50%);
        background: var(--primary);
        border-radius: 999px;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1.05rem;
      }

      ul {
        list-style: none;
        padding: 0;
        margin: 18px 0 0;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 14px;
      }

      li {
        position: relative;
        padding: 14px 16px 14px 38px;
        background: #f9fcfd;
        border: 1px solid var(--line);
        border-radius: 12px;
        color: var(--text);
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      }

      li::before {
        content: "";
        position: absolute;
        left: 16px;
        top: 50%;
        width: 10px;
        height: 10px;
        transform: translateY(-50%);
        background: var(--primary);
        border-radius: 50%;
      }

      li:hover {
        transform: translateY(-2px);
        border-color: var(--primary);
        box-shadow: 0 10px 22px rgba(13, 126, 140, 0.08);
      }

      @media (max-width: 640px) {
        .container {
          padding: 28px 22px;
          border-radius: 14px;
        }

        body {
          padding: 20px 12px;
        }

        h1 {
          margin-bottom: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>INIADの紹介</h1>

      <h2>概要</h2>
      <p>
        INIADでは入学直後から、世界中で使われているプログラミング言語「Python」を学びます。さらに、ソースプログラム管理システム「Git」を用いて、実践的な開発を経験していきます。
      </p>

      <h2>科目群一覧</h2>
      <ul>
        <li>コンピュータ・システム</li>
        <li>コンピュータ・ソフトウェア</li>
        <li>ユーザ・エクスペリエンス</li>
        <li>データサイエンス</li>
        <li>ICT社会応用</li>
        <li>連携科目群</li>
        <li>ビジネス構築</li>
        <li>コミュニティ形成</li>
      </ul>
    </div>
  </body>
</html>
